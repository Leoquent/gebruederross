<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>OG Card Preview – Gebrüder Ross</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  color: #fff;
}
.og-canvas {
  width: 1200px;
  height: 630px;
  background: radial-gradient(circle at 50% 40%, #1a3656 0%, #0e1f33 55%, #060e18 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 80px;
}

/* Subtle background grid & ambient light */
.og-canvas::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(185, 152, 90, 0.12) 1px, transparent 1px);
  background-size: 36px 36px;
  opacity: 0.6;
  pointer-events: none;
}
.ambient-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 750px;
  height: 500px;
  background: radial-gradient(circle, rgba(185, 152, 90, 0.22) 0%, rgba(22, 48, 77, 0) 70%);
  border-radius: 50%;
  pointer-events: none;
}

/* Luxury frame border */
.card-frame {
  position: absolute;
  inset: 24px;
  border: 1px solid rgba(185, 152, 90, 0.3);
  border-radius: 16px;
  pointer-events: none;
}
.card-frame::after {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(185, 152, 90, 0.12);
  border-radius: 10px;
}

/* Central Content Container (Safe Zone) */
.content-stack {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 980px;
}

/* Official Logo Icon */
.logo-wrap {
  margin-bottom: 20px;
  position: relative;
}
.logo-wrap img {
  height: 145px;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 35px rgba(185, 152, 90, 0.4));
}

/* Official Wordmark Text (rendered in white & gold) */
.logo-text-wrap {
  margin-bottom: 24px;
  max-width: 540px;
}
.logo-text-wrap img {
  width: 100%;
  height: auto;
  filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.6));
}

/* Core Headline */
.claim {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 54px;
  line-height: 1.15;
  font-weight: 700;
  font-style: italic;
  color: #dfc58e;
  margin-bottom: 20px;
  text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), 0 0 40px rgba(185, 152, 90, 0.25);
  letter-spacing: -0.01em;
}

/* Sub-location / Tagline */
.sub-tag {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.88);
  padding: 8px 24px;
  background: rgba(14, 31, 51, 0.65);
  border: 1px solid rgba(185, 152, 90, 0.35);
  border-radius: 30px;
  backdrop-filter: blur(8px);
}
/* Central content survives landscape and square center crops. */
.og-canvas { padding: 45px 310px; }
.ambient-glow { opacity: 0.3; }
.content-stack { width: 580px; flex: none; }
.brand-lockup { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 32px; }
.logo-wrap { margin-bottom: 0; display: flex; }
.logo-wrap img { height: 84px; filter: none; }
.logo-text-wrap { width: 380px; max-width: 380px; margin-bottom: 0; display: flex; }
.logo-text-wrap img { filter: none; }
.claim { width: 580px; font-size: 52px; line-height: 1.14; margin-bottom: 28px; text-shadow: none; color: #ffffff; }
.sub-tag { font-size: 26px; letter-spacing: 0.025em; text-transform: none; border: 0; padding: 0; background: none; color: #cbb27c; }
</style>
</head>
<body>

<div class="og-canvas">
  <div class="card-frame"></div>
  <div class="ambient-glow"></div>

  <div class="content-stack">
    <div class="brand-lockup">
    <!-- Official Logo Icon (Horse + GR) -->
    <div class="logo-wrap">
      <img id="brand-logo-icon" src="logo-icon-clean-white.svg" alt="Gebrüder Ross Signet">
    </div>

    <!-- Official Brand Wordmark -->
    <div class="logo-text-wrap">
      <img id="brand-logo-text" src="logo-text-clean-white.svg" alt="Gebrüder Ross – Nachlassservice">
    </div>

    </div>

    <!-- Core Headline -->
    <div class="claim">Ihr verlängerter Arm.<br>Bei jedem Nachlass vor Ort.</div>

    <!-- Sub Tag -->
    <div class="sub-tag">Stuttgart &amp; Umgebung</div>
  </div>
</div>



</body>
</html>
