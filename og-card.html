<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>OG Card Preview – Gebrüder Ross</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  color: #fff;
}
.og-canvas {
  width: 1200px;
  height: 630px;
  background: radial-gradient(circle at 50% 40%, #1a3656 0%, #0e1f33 55%, #060e18 100%);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 80px;
}

/* Subtle background grid & ambient light */
.og-canvas::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(185, 152, 90, 0.12) 1px, transparent 1px);
  background-size: 36px 36px;
  opacity: 0.6;
  pointer-events: none;
}
.ambient-glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 750px;
  height: 500px;
  background: radial-gradient(circle, rgba(185, 152, 90, 0.22) 0%, rgba(22, 48, 77, 0) 70%);
  border-radius: 50%;
  pointer-events: none;
}

/* Luxury frame border */
.card-frame {
  position: absolute;
  inset: 24px;
  border: 1px solid rgba(185, 152, 90, 0.3);
  border-radius: 16px;
  pointer-events: none;
}
.card-frame::after {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(185, 152, 90, 0.12);
  border-radius: 10px;
}

/* Central Content Container (Safe Zone) */
.content-stack {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 980px;
}

/* Official Logo Icon */
.logo-wrap {
  margin-bottom: 20px;
  position: relative;
}
.logo-wrap img {
  height: 145px;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 35px rgba(185, 152, 90, 0.4));
}

/* Official Wordmark Text (rendered in white & gold) */
.logo-text-wrap {
  margin-bottom: 24px;
  max-width: 540px;
}
.logo-text-wrap img {
  width: 100%;
  height: auto;
  filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.6));
}

/* Core Headline */
.claim {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 54px;
  line-height: 1.15;
  font-weight: 700;
  font-style: italic;
  color: #dfc58e;
  margin-bottom: 20px;
  text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8), 0 0 40px rgba(185, 152, 90, 0.25);
  letter-spacing: -0.01em;
}

/* Sub-location / Tagline */
.sub-tag {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.88);
  padding: 8px 24px;
  background: rgba(14, 31, 51, 0.65);
  border: 1px solid rgba(185, 152, 90, 0.35);
  border-radius: 30px;
  backdrop-filter: blur(8px);
}
</style>
</head>
<body>

<div class="og-canvas">
  <div class="card-frame"></div>
  <div class="ambient-glow"></div>

  <div class="content-stack">
    <!-- Official Logo Icon (Horse + GR) -->
    <div class="logo-wrap">
      <img src="logo_icon.webp" alt="Gebrüder Ross Signet">
    </div>

    <!-- Official Brand Wordmark -->
    <div class="logo-text-wrap">
      <img id="brand-logo-text" src="logo_text.webp" alt="Gebrüder Ross – Nachlassservice">
    </div>

    <!-- Core Headline -->
    <div class="claim">Ihr verlängerter Arm vor Ort.</div>

    <!-- Sub Tag -->
    <div class="sub-tag">Großraum Stuttgart</div>
  </div>
</div>

<script>
// Automatically convert navy letters in logo_text.webp to white on dark background while keeping gold lines intact
window.addEventListener('DOMContentLoaded', () => {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'logo_text.webp';
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2], a = d[i+3];
      if (a > 15) {
        // If it's navy / dark blue (b > r and r is low)
        if (b > r && r < 90 && g < 110) {
          d[i] = 255;
          d[i+1] = 255;
          d[i+2] = 255;
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);
    document.getElementById('brand-logo-text').src = canvas.toDataURL();
  };
});
</script>

</body>
</html>
